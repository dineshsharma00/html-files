<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-comppatible" content="IE=edge" />
    <meta name="viewoort" content="width=device_width, initial-scale=1.0" />
    <title>Job Application Form</title>
    <link rel="stylesheet" href="ps_1.css" />

</head>

<body>
    <div class="container">
        <div class="apply_box">
            <h1>Job Application
                <span class="title_small">(Web)</span>
            </h1>
            <form action="">
                <div class="form_container">
                    <div class="form_control">
                        <label for="first_name">First Name </label>
                        <input id="first_name" name="first_name" placeholder="Enter First Name " ; </div>

                        <div class="form_control">
                            <label for="Last_Name">Last Name </label>
                            <input id="Last_Name" name="Last_Name" placeholder="Enter Last Name " ; </div>

                            <div class="form_control">
                                <label for="email">Email </label>
                                <input type="email" id="email" name="Email" placeholder="Enter Email" </div>



                                <div class="form_control">
                                    <label for="job_rol">Job Role </label>

                                    <select>
                                        <option value="">Select Job Role</option>
                                        <option value="fronted">Fronted Developer</option>
                                        <option value="backend">Backend Developer</option>
                                        <option value="Full_Stack">Full Stack Developer</option>
                                        <option value="ui_ux">UI UX Designer</option>
                                    </select>
                                </div>


                                <div class="textarea_control>
                                    <label for="Address">Address </label>
                                    <textarea id="Address" row="4" cols="50" placeholder="Enter Address"></textarea>
                                </div>

                                <div class="form_control">
                                    <label for="City">City </label>
                                    <input type="City" id="City" name="City" placeholder="Enter City Name" </div>

                                    <div class="form_control">
                                        <label for="Pincode">Pincode </label>
                                        <input type="Pincode" id="Pincode" name="Pincode"
                                            placeholder="Enter Pincode Name" </div>

                                        <div class="form_control">
                                            <label for="date">Date </label>
                                            <input type="Date" id="Date" name="Date" placeholder="Enter Date Name"
                                                </div>

                                            <div class="form_control">
                                                <label for="your cv">Upload Your CV </label>
                                                <input type="file" id="Upload " name="Upload Your CV" </div>
                                            </div>
                                        </div>
                                        <div class="button_container"></div>
                                        <button type="submit">Apply Now</button>
            </form>
        </div>
    </div>


</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile card</title>
    <link rel="stylesheet" href="profile card.css">
</head>
<body>

        <img
         src="Dinesh.jpeg" width="100px" 
         alt="Dinesh sharma"

        <h1>Dinesh Sharma</h1>
        <h3>Student | Web Developer</h3>

            I am a B.Tech CSE Student.
            Freelance Web Developer
        </p>

            <span>HTML</span>
            <span>CSS</span>

            <span>Web design</span>
        </div>
       
        <a href="https://github.com/dineshsharma00/html-files" class="contact-btn">

        </a>
    </div>
    
</body>
</html>

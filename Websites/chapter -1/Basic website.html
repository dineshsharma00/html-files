        <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Basic Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: #444;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffcc00;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        ul {
            line-height: 2;
        }

        a.website-link {
            color: #0066cc;
            text-decoration: none;
        }

        a.website-link:hover {
            text-decoration: underline;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Basic Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">
        <h2>Useful Links</h2>
        <p>Click any of the links below to visit the websites:</p>

        <ul>
            <li><a class="website-link" href="https://www.google.com" target="_blank">Google</a></li>
            <li><a class="website-link" href="https://www.facebook.com" target="_blank">Facebook</a></li>
            <li><a class="website-link" href="https://www.youtube.com" target="_blank">YouTube</a></li>
            <li><a class="website-link" href="https://www.wikipedia.org" target="_blank">Wikipedia</a></li>
            <li><a class="website-link" href="https://www.github" target="_blank">github</a></li>
        </ul>
    </div>

    <footer>
        <p>&copy; 2026 My Basic Website</p>
    </footer>

</body>
</html>

        
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Page</title>
    <link rel="stylesheet" href="styleclub.css">
</head>
<body>
    <!--header-->
    <nav>
        <div id="codingclub">Coding <Club>
            <div class="learn">Learn. Build. share.</div>
        </Club></div>
    </nav>
    <div class="container">

    
        <!--Upcoming Events-->


        <section class="card">
            <h1>Upcoming Events</h1>
    
    <table>       
        <thead>
           
             <tr>
                 <th>Event</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>
            </thead>
        <tbody> <tr>
                <td>HTML Workshop</td>
                <td>14Nov</td>
                <td>Lab1</td>
            </tr>
            <tr>
                <td>Hackthon</td>
                <td>20Nov</td>
                <td>Seminar Hall</td>
            </tr>
        </tbody>    
        </table>
        </section>

        <!--Registration form-->
        <section class="card register">
            <h1>Register</h1>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name"
                placeholder="Enter Your Name"
                required>
                <br>
                <label for="email">Email:</label>
                <input type="email" id="email"
                placeholder="you@example.com"
                required>
                <br>
                
                <button type="submit">Register Now </button>

            </form>
        </section>

    
</body>
</html>

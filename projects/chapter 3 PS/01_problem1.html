<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body */
body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #fff5f5;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Header */
header {
    background-color: #e23744;
    color: white;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
}

/* Zomato Logo/Text */
header > div:first-child {
    font-size: 32px;
    font-weight: bold;
}

/* Navigation */
header > div:last-child {
    display: flex;
    gap: 30px;
}

header a {
    color: white;
    text-decoration: none;
    font-size: 17px;
    font-weight: 500;
    transition: color 0.3s ease;
}

header a:hover {
    color: #ffd6d9;
}

/* Main */
main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(
        rgba(226, 55, 68, 0.08),
        rgba(255, 255, 255, 0.9)
    );
}

/* Main Text */
main div {
    color: #e23744;
    font-size: 42px;
    font-weight: bold;
    text-transform: capitalize;
}

/* Footer */
footer {
    background-color: #b71c1c;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 14px;
}

/* Responsive Design */
@media (max-width: 600px) {
    header {
        height: auto;
        padding: 20px;
        flex-direction: column;
        gap: 15px;
    }

    header > div:last-child {
        gap: 20px;
    }

    main div {
        font-size: 30px;
        padding: 20px;
    }
}
</style>
</head>
<body>
    <header>
        <div>Zomato</div>
        <div>
            <a href="/home">Home</a>
            <a href="/About">About</a>
            <a href="/Contact">Contact</a>
        </div>
    </header>

    <main>

        <div>
            order food antime,anywhere
        </div>
        
    </main>

    <footer>
        copyright Zomato ALL rights reserved
    </footer>
    
</body>
</html>

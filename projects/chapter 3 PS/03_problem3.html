<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUR FAVORITE WEBSTES</title>
    <style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
}

/* Heading */
h1 {
    color: white;
    font-size: 42px;
    text-align: center;
    text-transform: capitalize;
    margin-bottom: 20px;
}

/* Links */
a {
    width: 250px;
    padding: 15px 20px;
    background-color: white;
    color: #333;
    text-decoration: none;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    transition: all 0.3s ease;
}

/* Hover effect */
a:hover {
    transform: translateY(-5px) scale(1.03);
    background-color: #333;
    color: white;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
}

/* Individual website colors */
a:nth-of-type(1):hover {
    background-color: #4285f4;
}

a:nth-of-type(2):hover {
    background-color: #0077b5;
}

a:nth-of-type(3):hover {
    background-color: #ff0000;
}

a:nth-of-type(4):hover {
    background: linear-gradient(45deg, #feda75, #d62976, #4f5bd5);
}

/* Mobile */
@media (max-width: 600px) {
    h1 {
        font-size: 32px;
    }

    a {
        width: 80%;
        max-width: 300px;
    }
}
</style>
</head>
<body>
    <h1>Your favorite websites</h1>
    <a href="https://google.com" target="_blank">google</a>
     <a href="https://Linkedin.com" target="_blank">Linkedin</a>
      <a href="https://youtube.com" target="_blank">youtube</a>
       <a href="https://instagram.com" target="_blank">instagram</a>
    
</body>
</html>

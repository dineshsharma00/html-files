        <style>/* General page styling */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 40px 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #333;
}

/* Form container */
form {
    max-width: 600px;
    margin: auto;
    padding: 30px;
    background-color: #ffffff;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

/* Heading */
h1 {
    text-align: center;
    color: #ffffff;
    margin-bottom: 25px;
    font-size: 32px;
}

/* Form sections */
form div {
    margin-bottom: 15px;
}

/* Labels */
label {
    display: inline-block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #444;
}

/* Text inputs */
input[type="text"],
input[type="tel"],
input[type="phone"],
input[type="email"],
input[type="password"],
input[type="age"],
select {
    width: 100%;
    padding: 12px 14px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    background-color: #fafafa;
    transition: 0.3s;
}

/* Focus effect */
input:focus,
select:focus {
    border-color: #667eea;
    box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
    background-color: #fff;
}

/* Placeholder */
input::placeholder {
    color: #999;
}

/* Select box */
select {
    cursor: pointer;
}

/* Multiple select */
select[multiple] {
    min-height: 120px;
}

/* Programming language section */
form p {
    font-weight: bold;
    margin-bottom: 10px;
}

input[type="checkbox"] {
    width: auto;
    margin-right: 5px;
    accent-color: #667eea;
}

/* Checkbox labels */
input[type="checkbox"] + label {
    display: inline;
}

/* Buttons */
button {
    padding: 12px 22px;
    margin: 8px 5px 0 0;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

/* Submit button */
button[type="submit"] {
    background-color: #667eea;
    color: white;
}

button[type="submit"]:hover {
    background-color:red
    ;
    transform: translateY(-2px);
}

/* Disabled button */
button:disabled {
    background-color: #ccc;
    color: #777;
    cursor: not-allowed;
}

/* Reset button */
button[type="reset"] {
    background-color: #e74c3c;
    color: white;
}

button[type="reset"]:hover {
    background-color: #c0392b;
    transform: translateY(-2px);
}

/* Responsive design */
@media (max-width: 600px) {
    body {
        padding: 20px 10px;
    }

    form {
        padding: 20px;
    }

    h1 {
        font-size: 26px;
    }

    button {
        width: 100%;
        margin-top: 10px;
    }
}
</style>
